name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - name: the rig files parse
        # Neither compose file has a test behind it — the stores rig is booted by the
        # job below, but the telemetry rig is a laptop tool CI never runs, so a typo
        # in it would first be found by a human waiting to look at a burst. `config`
        # interpolates and validates without pulling anything. The platform profile
        # (E5) is rendered too — it is off by default, so a bare `config` skips it.
        run: |
          docker compose -f docker/compose.yaml config -q
          docker compose -f docker/compose.yaml --profile platform config -q
          docker compose -f docker/compose.telemetry.yaml config -q
      - name: migrations take no unsafe locks
        # Needs no database — it reads the SQL. Rules and exclusions live in
        # .squawk.toml, each exclusion with the claim that justifies it.
        run: uv run squawk packages/control-plane/src/control_plane/migrations/*.sql

  # The deployment's artifacts (E5): the two platform images build, the public
  # one is as empty as it claims, and the reference manifests are valid k8s.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the control-plane image
        run: docker build -f docker/control-plane/Dockerfile -t usf/control-plane:latest .
      - name: the webhook-receiver image
        run: docker build -f docker/webhook-receiver/Dockerfile -t usf/webhook-receiver:latest .
      - name: the receiver image is an HMAC filter and nothing else
        # TO-BE §5: no control-plane code, no ledger client, no GitHub client, no
        # git, no docker behind the public route. Every module in the list must
        # fail to import (an explicit check — `set -e` ignores a `!`-inverted
        # command); the receiver itself must import, as a non-root user.
        run: |
          set -e
          img=usf/webhook-receiver:latest
          for banned in control_plane dev_agent psycopg boto3 jwt requests; do
            if docker run --rm --entrypoint python "$img" -c "import $banned" 2>/dev/null; then
              echo "::error::the receiver image can import $banned — the public process is no longer just an HMAC filter"
              exit 1
            fi
          done
          if docker run --rm --entrypoint sh "$img" -c "command -v git || command -v docker" 2>/dev/null; then
            echo "::error::the receiver image carries git or docker"; exit 1
          fi
          docker run --rm --entrypoint python "$img" -c "import webhook_receiver.cli, secret_refs"
          test "$(docker run --rm --entrypoint id "$img" -u)" = "1000"
      - name: the dev-agent image
        # The thing every burst actually is. It was unbuildable from a clean
        # checkout for a while and nothing noticed, because nothing built it —
        # this step is that gap closed.
        run: docker build -f docker/dev-agent/Dockerfile -t usf/dev-agent:latest .
      - name: the burst image carries no control-plane code
        # ARCHITECTURE.md §8 and CLAUDE.md's layout rule: the worker ships alone.
        # A burst that could import the control plane could reach the ledger.
        run: |
          set -e
          img=usf/dev-agent:latest
          for banned in control_plane psycopg boto3; do
            if docker run --rm --entrypoint python "$img" -c "import $banned" 2>/dev/null; then
              echo "::error::the dev-agent image can import $banned — a burst must not carry it"
              exit 1
            fi
          done
          docker run --rm --entrypoint python "$img" -c "import dev_agent.cli, session_volume"
          test "$(docker run --rm --entrypoint id "$img" -u)" = "1000"
      - name: the burst image runs the SDK the lock names
        # #120: the image installs uv.lock's versions, hash-checked, and drives
        # the CLI that SDK bundles — so the engine is a fact about the lock, not
        # about the day the image was built. The bundled CLI's own --version has
        # to agree with the version its SDK declares.
        run: |
          set -e
          img=usf/dev-agent:latest
          locked=$(python3 -c "import tomllib; print(next(p['version'] for p in tomllib.load(open('uv.lock', 'rb'))['package'] if p['name'] == 'claude-agent-sdk'))")
          read -r shipped declared <<< "$(docker run --rm --entrypoint python "$img" -c \
            "import claude_agent_sdk; from claude_agent_sdk._cli_version import __cli_version__; print(claude_agent_sdk.__version__, __cli_version__)")"
          if [ "$shipped" != "$locked" ]; then
            echo "::error::the dev-agent image carries claude-agent-sdk $shipped, uv.lock names $locked"; exit 1
          fi
          ran=$(docker run --rm --entrypoint sh "$img" -c \
            '"$(python -c "from dev_agent.cli import BUNDLED_CLI; print(BUNDLED_CLI)")" --version')
          case "$ran" in
            "$declared"*) ;;
            *) echo "::error::the bundled CLI says '$ran', its SDK declares $declared"; exit 1 ;;
          esac
          echo "claude-agent-sdk $shipped (lock: $locked), bundled CLI $declared" >> "$GITHUB_STEP_SUMMARY"
      - name: the burst-phases image
        run: docker build -f docker/burst-phases/Dockerfile -t usf/burst-phases:latest .
      - name: the phases image holds capabilities, never credentials
        # TO-BE §6, G2: what runs beside a burst cannot reach a ledger or a
        # store. No control-plane code, no ledger client, no cloud SDK — the
        # phases hold presigned URLs for single objects. `git` *is* expected:
        # init clones the product with a contents:read, single-repo token.
        run: |
          set -e
          img=usf/burst-phases:latest
          for banned in control_plane dev_agent psycopg boto3 structlog; do
            if docker run --rm --entrypoint python "$img" -c "import $banned" 2>/dev/null; then
              echo "::error::the phases image can import $banned — a pod must not carry it"
              exit 1
            fi
          done
          docker run --rm --entrypoint python "$img" -c "import burst_phases.cli, session_volume"
          docker run --rm --entrypoint sh "$img" -c "command -v git >/dev/null"
          test "$(docker run --rm --entrypoint id "$img" -u)" = "1000"
          # both entrypoints refuse loudly rather than half-working
          if docker run --rm "$img" 2>/dev/null; then
            echo "::error::burst-init succeeded with nothing to do"; exit 1
          fi
      - name: the control-plane image runs the CLI
        run: |
          docker run --rm usf/control-plane:latest --help >/dev/null
          docker run --rm --entrypoint sh usf/control-plane:latest -c "docker --version && git --version && kubectl version --client=true"
      - name: the control-plane image imports every module it ships
        # `--help` reaches the CLI and nothing it defers: a runner is imported
        # when `run` picks one. The image installs control-plane's declared
        # dependencies, not the workspace, so an undeclared import passes every
        # test and fails here — burst-phases did, and only a replica with
        # BURST_NAMESPACE set found out.
        run: |
          docker run --rm --entrypoint python usf/control-plane:latest -c "
          import importlib, pkgutil, control_plane
          for m in pkgutil.walk_packages(control_plane.__path__, 'control_plane.'):
              importlib.import_module(m.name)
          "
      - name: the reference k8s manifests are valid
        # kubeconform, pinned, from its image — no cluster, no kubectl; the
        # manifests are examples (TO-BE §5) and this is what keeps them from rotting.
        run: docker run --rm -v "$PWD/examples/k8s:/m:ro" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /m

  # Bursts as Jobs, on a real cluster (G3/G4/G6): the runner contract against
  # JobsRunner, the golden replay (#45) — one node under the cluster's default
  # runtime and under gVisor — and the M4 wall probes (#47) on Cilium with the
  # reference egress policy. Both matrices are this job's artifacts; a breach
  # fails the job.
  cluster:
    runs-on: ubuntu-latest
    env:
      KIND_VERSION: v0.31.0
      BURST_NAMESPACE: bursts
      BURST_PHASES_IMAGE: usf/burst-phases:latest
      BURST_AGENT_IMAGE: usf/dev-agent:latest
      BURST_REPLAY_RUNTIMES: default,gvisor
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: kind, pinned
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64"
          sudo install -m 0755 kind /usr/local/bin/kind
      - name: the agent image the golden burst runs
        run: docker build -q -f docker/dev-agent/Dockerfile -t "$BURST_AGENT_IMAGE" .
      - name: the cluster on Cilium, the archive, and gVisor as a second RuntimeClass
        run: |
          ./scripts/burst-cluster.sh --gvisor --cilium | tee cluster.txt
          # the archive's address is the host's, which only the script knows
          grep -o "ARCHIVE_URL='[^']*'" cluster.txt | tr -d "'" >> "$GITHUB_ENV"
      - name: the runner contract and the harness, on the cluster
        run: uv run pytest tests/test_runner_contract.py tests/test_jobs_runner.py tests/test_replay.py
      - name: the golden replay
        run: |
          uv run control-plane replay examples/golden/check.json \
            --runtime default --runtime gvisor --data-dir data --out replay --strict
          cat replay/matrix.md >> "$GITHUB_STEP_SUMMARY"
      - name: M4 — the box tries its own walls
        run: |
          uv run control-plane replay examples/golden/walls.json \
            --runtime default --runtime gvisor --data-dir data --out m4 --strict
          cat m4/matrix.md >> "$GITHUB_STEP_SUMMARY"
      - name: the criteria matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-replay-matrix
          path: replay/
          if-no-files-found: error
      - name: the M4 breach rate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-breach-rate
          path: m4/
          if-no-files-found: error

  # The state block's per-PR proof: the schema applies from nothing, twice, and
  # the suite then runs against the real service backends rather than the
  # single-node ones alone — a real Postgres and a real S3 bucket.
  stores:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4 # pinned to the dev rig (docker/compose.yaml)
        env:
          POSTGRES_USER: platform_admin
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform_admin -d platform"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # sslmode is explicit so this one string works for psycopg and for Atlas,
      # which refuses to guess (the rig speaks no TLS).
      LEDGER_DSN: postgresql://platform_admin:platform@localhost:5432/platform?sslmode=disable
      ATLAS_DEV_URL: postgresql://platform_admin:platform@localhost:5432/atlas_dev?sslmode=disable
      # tls=false is this store's sslmode=disable. Credentials match the rig's
      # s3.json, which is dev-only by construction: the gateway is on localhost
      # and the volume dies with the job.
      ARCHIVE_URL: s3://platform:platform-dev-secret@localhost:8333/platform-sessions?tls=false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: ariga/setup-atlas@v0
        with:
          version: v1.2.1 # pinned: the drift check below reads Atlas's output
      - name: the archive's backend, from the rig's own definition
        # A step rather than a `services:` entry, because a service container
        # cannot be given a command and this image needs one. Compose is the
        # single definition of the rig either way — CI runs the same file a
        # laptop does, so the two cannot drift.
        run: docker compose -f docker/compose.yaml up -d --wait seaweedfs
      - run: uv sync --locked
      - name: from zero
        run: uv run control-plane migrate
      - name: again — idempotent
        run: uv run control-plane migrate
      - name: no pending migrations left
        run: uv run control-plane migrate --check
      - name: an empty database for Atlas to normalize schema.sql in
        # A database on the service we already have, rather than Atlas's
        # docker:// default — no second image to pull. psycopg, not psql, so the
        # step depends on nothing the project doesn't already install.
        run: |
          uv run python - <<'PY'
          import os, psycopg
          psycopg.connect(os.environ["LEDGER_DSN"], autocommit=True).execute("CREATE DATABASE atlas_dev")
          PY
      - name: schema.sql and the migrations agree
        # The gate #58 bought: what `migrate` just built, compared against what
        # schema.sql declares. Anything but "synced" is drift between the two.
        # `atlas schema diff` exits 0 either way, so the message is the signal —
        # which means a wording change in Atlas fails this closed, on purpose.
        run: |
          out=$(atlas schema diff --env local \
            --var dev_url="$ATLAS_DEV_URL" \
            --from "$LEDGER_DSN" --to "file://schema.sql" 2>&1)
          echo "$out"
          case "$out" in
            *"Schemas are synced"*) ;;
            *) echo "::error::schema.sql and the migration directory have drifted — see the plan above"; exit 1 ;;
          esac
      - name: the suite, against the service backends
        # Both contract suites see their service backend here — the ledger's
        # because LEDGER_DSN is set, the archive's because ARCHIVE_URL is — and
        # so do the process tests: the multi-replica race (tests/test_replicas.py,
        # E2/E3) and the webhook path (tests/test_wakes.py, E5), replicas and
        # the receiver as real processes on this Postgres.
        # Everything else keeps its own scratch space regardless
        # (tests/conftest.py explains why that has to be forced).
        run: uv run pytest
      - name: what the archive was left holding
        # Cheap, and it is the one thing the suite cannot assert about itself: no
        # test wrote to a bare sessions/ key, so nothing bypassed the isolation.
        if: always()
        run: |
          uv run python - <<'PY'
          import os
          from control_plane.objectstore import ObjectSessionArchive
          archive = ObjectSessionArchive.from_url(os.environ["ARCHIVE_URL"])
          listing = archive._client.list_objects_v2(Bucket=archive.bucket).get("Contents", [])
          leaked = [o["Key"] for o in listing if o["Key"].startswith("sessions/")]
          print(f"{len(listing)} objects, {len(leaked)} outside a test prefix")
          assert not leaked, f"tests wrote to the shared archive root: {leaked[:5]}"
          PY
