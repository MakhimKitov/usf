# The dev rig: the two service stores Stage A introduces — Postgres (the
# ledger) and SeaweedFS (the session archive, through its S3 gateway). Single
# node, throwaway, laptop-only: the same two *capabilities* a deployment buys
# from managed services, which is why nothing above this file names either
# product (capabilities, not instruments — TO-BE.md §12).
#
#   docker compose -f docker/compose.yaml up -d --wait
#   export LEDGER_DSN='postgresql://platform_admin:platform@localhost:5432/platform?sslmode=disable'
#   uv run control-plane migrate            # from zero, then a no-op
#   docker compose -f docker/compose.yaml down -v     # -v: empty volumes again
#
# With LEDGER_DSN / ARCHIVE_URL unset the platform runs on SQLite and a local
# directory exactly as before — the rig is never required to run the MVP.
#
# The `platform` profile (E5) adds the platform itself on top of the two stores —
# the migration, two control-plane replicas and the webhook receiver — as the
# images CI builds, plus the dev-agent image the replicas run bursts in. It is
# the T0 deployment shape (TO-BE §6: a Docker host is first-class; k8s arrives
# with the runners in Stage G), rehearsed at E6 — DEPLOYMENT.md is the runbook:
#
#   # docker/.env (compose's interpolation file — pin the two paths there, not in
#   # the shell: an `up` from a shell without them recreates the replicas onto the defaults)
#   PLATFORM_DATA=/srv/usf/data        # absolute; see control-plane below
#   PLATFORM_SECRETS=/srv/usf/secrets  # the App keys .env's *_PRIVATE_KEY_PATH name
#
#   docker compose -f docker/compose.yaml --profile platform up -d --build --wait
#
# Off by default, so `up` without the profile is still just the stores.

name: usf-rig

services:
  postgres:
    image: postgres:18.4 # pinned to CI's service container (.github/workflows/ci.yml)
    environment:
      # platform_admin owns the schema and runs migrations; platform_app — what
      # replicas connect as, whose grants are walls — is created by ./postgres/init.
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: platform # dev-only, and the rig publishes to localhost
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      # 18+ wants the whole directory, not .../data: the image lays data out in
      # major-version subdirectories so pg_upgrade --link can work across them.
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d platform"]
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.41
    # `server` runs master + volume + filer + S3 in one process: the whole store
    # as one node, which is why no advertised address (-ip) needs setting — the
    # components find each other on the container's own network.
    command: >
      server -dir=/data -master.volumeSizeLimitMB=256
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333" # S3 gateway — the archive endpoint (consumed at A5)
      - "9333:9333" # master UI, for looking at what the rig is holding
    volumes:
      - seaweed-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # 127.0.0.1, not localhost: the container resolves localhost to ::1 first
      # and the master listens on IPv4 only, so the name never connects.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/status"]
      interval: 2s
      timeout: 3s
      retries: 30

  # --- the platform (profile: platform) ---

  migrate:
    # Runs once, as the schema owner, before any replica starts: `migrate` is
    # platform_admin's verb and the replicas connect as platform_app (STORES.md).
    image: usf/control-plane:latest
    build:
      context: ..
      dockerfile: docker/control-plane/Dockerfile
    profiles: [platform]
    environment:
      LEDGER_DSN: postgresql://platform_admin:platform@postgres:5432/platform?sslmode=disable
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  control-plane:
    image: usf/control-plane:latest
    build:
      context: ..
      dockerfile: docker/control-plane/Dockerfile
    profiles: [platform]
    deploy:
      replicas: 2 # two stateless peers over one ledger (E2); the service name resolves to both
    # a replica that dies comes back as a new replica — the ledger's leases make
    # that safe (E1/E2), and a fleet that stays down is the one failure the
    # design cannot absorb. E6's rehearsal lost both without this: one to the
    # kill drill, one to a network blip
    restart: unless-stopped
    env_file:
      - path: ../.env # the App refs and switches — the same file a laptop run reads
        required: false
    environment:
      LEDGER_DSN: postgresql://platform_app:platform_app@postgres:5432/platform?sslmode=disable
      ARCHIVE_URL: s3://platform:platform-dev-secret@seaweedfs:8333/platform-sessions?tls=false
      WAKE_BIND: 0.0.0.0:8081 # the internal wake endpoint — on the compose network only, never published
      DEV_AGENT_OTLP_ENDPOINT: ${DEV_AGENT_OTLP_ENDPOINT:-}
    volumes:
      # bursts are `docker run` against the host's daemon (DockerRunner, until
      # Stage G), which reads bind-mount paths in *its* namespace — so the data
      # dir is mounted at the same absolute path inside the replica as on the host
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PLATFORM_DATA:-/srv/usf/data}:${PLATFORM_DATA:-/srv/usf/data}
      # the App private keys: .env names them by path (*_PRIVATE_KEY_PATH, file:
      # refs), and a path has to mean the same file on the host and in the replica
      # — same-path again, read-only. Never under PLATFORM_DATA: bursts are handed
      # mounts out of that tree.
      - ${PLATFORM_SECRETS:-/srv/usf/secrets}:${PLATFORM_SECRETS:-/srv/usf/secrets}:ro
    command: ["run", "--data-dir", "${PLATFORM_DATA:-/srv/usf/data}", "--interval", "${SCHEDULER_POLL_INTERVAL_S:-60}"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy

  webhook-receiver:
    # The one public surface. TLS terminates in front of this (E6's HTTPS route);
    # here the port is published plain for the rehearsal.
    image: usf/webhook-receiver:latest
    build:
      context: ..
      dockerfile: docker/webhook-receiver/Dockerfile
    profiles: [platform]
    restart: unless-stopped
    env_file:
      # its OWN file, never ../.env: what a public process can leak is what it was
      # handed, so the receiver is handed exactly the App ids, their webhook-secret
      # refs and the values those refs name (.env.receiver.example) — no platform
      # credential is in its environment to begin with
      - path: ../.env.receiver
        required: false
    environment:
      WAKE_URL: http://control-plane:8081
      RECEIVER_BIND: 0.0.0.0:8080
    ports:
      - "${RECEIVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      control-plane:
        condition: service_started

  dev-agent:
    # Built, never run: bursts are `docker run` by the replicas against the host's
    # daemon (DockerRunner), so this image only has to *exist* there — zero replicas
    # makes `up --build` build it next to the other two and start nothing.
    image: usf/dev-agent:latest
    build:
      context: ..
      dockerfile: docker/dev-agent/Dockerfile
    profiles: [platform]
    deploy:
      replicas: 0

volumes:
  postgres-data:
  seaweed-data:
