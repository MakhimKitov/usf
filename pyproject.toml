[project]
name = "usf"
version = "0.1.0"
description = "Autonomous maintenance platform: control plane + the dev-agent image it runs."
readme = "README.md"
authors = [
    { name = "MakhimKitov", email = "titov.ms.msu@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "burst-phases",
    "control-plane",
    "dev-agent",
    "secret-refs",
    "session-volume",
    "webhook-receiver",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
burst-phases = { workspace = true }
control-plane = { workspace = true }
dev-agent = { workspace = true }
secret-refs = { workspace = true }
session-volume = { workspace = true }
webhook-receiver = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "squawk-cli>=2.62.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]  # never collect from data/ (platform clones carry the product suite)
