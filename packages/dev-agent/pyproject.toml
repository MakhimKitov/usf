[project]
name = "dev-agent"
version = "0.1.0"
description = "The burst worker: runs one work burst inside the dev container. Standalone — must never depend on control-plane (the image cannot contain platform code)."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.175",
    "session-volume",
    "structlog>=26.1.0",
]

[tool.uv.sources]
session-volume = { workspace = true }

[project.scripts]
dev-agent = "dev_agent.cli:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"
