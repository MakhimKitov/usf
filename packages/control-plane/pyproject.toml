[project]
name = "control-plane"
version = "0.1.0"
description = "The scheduler: spawns burst containers, owns all persistence (sessions, ledger) and telemetry."
requires-python = ">=3.12"
dependencies = [
    "burst-phases",
    "dev-agent",
    "secret-refs",
    "session-volume",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "pyjwt>=2.8",
    "cryptography>=42",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "structlog>=26.1.0",
    "psycopg[binary]>=3.2",
    # The S3 protocol client for the session archive (A5). Control-plane only —
    # a burst container never holds storage credentials, so the dev-agent package
    # must never grow this.
    "boto3>=1.35",
]

[project.scripts]
control-plane = "control_plane.cli:main"

[tool.uv.sources]
burst-phases = { workspace = true }
session-volume = { workspace = true }
dev-agent = { workspace = true }
secret-refs = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"
