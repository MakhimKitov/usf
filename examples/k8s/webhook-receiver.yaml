# The webhook receiver on a cluster: the platform's only public surface (TO-BE
# §5, E5). Stateless, credential-free apart from the webhook secrets, and
# allowed to talk to exactly one thing. Reference only — see README.md.
apiVersion: v1
kind: Secret
metadata:
  name: webhook-secrets
type: Opaque
stringData:
  # One file per App whose webhook points at the receiver; WEBHOOK_APPS below
  # names each as a file: ref. The dev App's webhook is enough — it is installed
  # on every product repo — so one entry is the common case.
  dev: "REPLACE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-receiver
  labels:
    app.kubernetes.io/name: webhook-receiver
spec:
  replicas: 2 # dedup is per process — two replicas may each forward one copy of a delivery; that is one extra poll, by design
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-receiver
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: webhook-receiver
          image: usf/webhook-receiver:latest
          env:
            - name: WEBHOOK_APPS
              value: "REPLACE_ME_APP_ID=file:/etc/usf/webhooks/dev"
            - name: WAKE_URL
              value: "http://control-plane:8081"
            - name: RECEIVER_BIND
              value: "0.0.0.0:8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: webhooks
              mountPath: /etc/usf/webhooks
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: webhooks
          secret:
            secretName: webhook-secrets
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-receiver
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: webhook-receiver
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# E6's one public HTTPS route. The GitHub Apps' webhook URL is https://<host>/ .
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webhook-receiver
  annotations:
    cert-manager.io/cluster-issuer: REPLACE_ME # or however the adopter terminates TLS
spec:
  tls:
    - hosts: ["webhooks.REPLACE_ME"]
      secretName: webhook-receiver-tls
  rules:
    - host: webhooks.REPLACE_ME
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webhook-receiver
                port:
                  name: http
---
# The wall around the public process: in on 8080 from anywhere (the ingress
# controller is "anywhere" from the pod's point of view), out to the control
# plane's wake port and to DNS, nothing else. A compromised receiver can make
# the platform poll GitHub — and can reach nothing else on the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webhook-receiver
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: webhook-receiver
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: control-plane
      ports:
        - port: 8081
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
